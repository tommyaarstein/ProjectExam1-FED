<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Enter your delivery details and complete your purchase from TING.">
    <meta name="referrer" content="strict-origin-when-cross-origin">

    <title>Checkout | TING</title>

    <link rel="stylesheet" href="../src/css/styles.css">
    <script type="module" src="../src/js/pages/checkout.js"></script>
  </head>

  <body data-page="checkout">
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <header id="site-header" class="site-header"></header>

    <main id="main-content" class="checkout-page">
      <div class="checkout-page__inner">
        <a class="checkout-page__back-link" href="../cart/index.html">
          <img src="../assets/icons/24px/arrow-right.png" alt="" width="24" height="24">
          <span>Back to cart</span>
        </a>

        <h1>Checkout</h1>

        <form id="checkout-form" class="checkout-page__layout">
          <aside class="checkout-summary" aria-labelledby="checkout-summary-heading">
            <h2 id="checkout-summary-heading">Order summary</h2>

            <p id="checkout-summary-status" class="checkout-summary__status" aria-live="polite">Loading order summary...</p>

            <ul id="checkout-summary-products" class="checkout-summary__products" aria-label="Products in your order" hidden></ul>

            <dl id="checkout-summary-totals" class="checkout-summary__totals" hidden>
              <div class="checkout-summary__total-row">
                <dt>Total</dt>
                <dd id="checkout-total"></dd>
              </div>
            </dl>

            <div class="checkout-summary__desktop-action">
              <button class="button checkout-page__desktop-submit" type="submit" disabled>Complete purchase</button>
            </div>
          </aside>

          <div class="checkout-page__form-column">
            <fieldset class="checkout-section checkout-section--delivery">
              <legend class="checkout-section__heading">
                <span class="checkout-section__number" aria-hidden="true">1</span>
                <span>Delivery details</span>
              </legend>

              <div class="checkout-field">
                <label for="full-name">Full name</label>
                <input id="full-name" name="fullName" type="text" autocomplete="name" placeholder="John Doe" required>
              </div>

              <div class="checkout-field">
                <label for="checkout-email">Email</label>
                <input id="checkout-email" name="email" type="email" autocomplete="email" placeholder="name@example.com" required>
              </div>

              <div class="checkout-field">
                <label for="address">Address</label>
                <input id="address" name="address" type="text" autocomplete="street-address" placeholder="Street name and number" required>
              </div>

              <div class="checkout-field-row">
                <div class="checkout-field">
                  <label for="postal-code">Postal code</label>
                  <input id="postal-code" name="postalCode" type="text" autocomplete="postal-code" placeholder="0000" required>
                </div>

                <div class="checkout-field">
                  <label for="city">City</label>
                  <input id="city" name="city" type="text" autocomplete="address-level2" placeholder="City" required>
                </div>
              </div>

              <div class="checkout-field">
                <label for="country">Country</label>
                <input id="country" name="country" type="text" list="country-options" autocomplete="country-name" placeholder="Start typing a country" required>
                <datalist id="country-options"></datalist>
              </div>
            </fieldset>

            <fieldset class="checkout-section checkout-section--payment">
              <legend class="checkout-section__heading">
                <span class="checkout-section__number" aria-hidden="true">2</span>
                <span>Payment method</span>
              </legend>

              <label class="checkout-payment-option">
                <input name="paymentMethod" type="radio" value="card" required checked>
                <span>Card</span>
              </label>

              <label class="checkout-payment-option">
                <input name="paymentMethod" type="radio" value="paypal">
                <span>PayPal</span>
              </label>

              <label class="checkout-payment-option">
                <input name="paymentMethod" type="radio" value="klarna">
                <span>Klarna</span>
              </label>
            </fieldset>

            <button class="button checkout-page__mobile-submit" type="submit" disabled>
              Complete purchase - <span id="checkout-mobile-total"></span>
            </button>

            <p id="checkout-form-status" class="checkout-page__form-status" aria-live="polite" aria-atomic="true"></p>
          </div>
        </form>
      </div>
    </main>

    <footer id="site-footer" class="site-footer"></footer>
  </body>
</html>
